<!-- components/club_filters.html -->
<div class="club-filters-container" id="filter-row" aria-label="סינון לפי מועדונים">
    <span class="filters-group-label">סינון לפי מועדונים (ניתן לבחור מספר מועדונים):</span>
    <div class="club-filters-group" id="programFilters" role="group" aria-label="סינון לפי מועדונים" data-show-counts="{{ 'true' if show_counts else 'false' }}">
        <span class="filters-loading">טוען מועדונים…</span>
    </div>
    {% if show_radius_control %}
    <div id="controls-radius">
        <label for="radius-slider">רדיוס חיפוש (ק"מ):</label>
        <div id="radius-slider-container">
            <input type="range" id="radius-slider" min="0.5" max="5" step="0.1" value="1.0"
                oninput="updateRadiusFromSlider(this.value)">
            <span id="radius-value">1.0</span>
        </div>
    </div>
    {% endif %}
</div>
