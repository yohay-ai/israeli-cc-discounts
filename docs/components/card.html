<!-- components/card.html -->
<template id="deal-card-template">
    <div class="card business-card">
        <div class="card-header">
            <div class="card-title-area">
                <h3 class="business-name"></h3>
                <span class="multi-badge hidden"></span>
            </div>
            <div class="best-discount-pill hidden">
                <span class="best-disc-val"></span>
                <span class="best-disc-lbl">הנחה מרבית</span>
            </div>
            <div class="voucher-pill hidden">
                <span class="voucher-icon">🎁</span>
                <span class="voucher-label">שובר</span>
                <span class="voucher-count"></span>
            </div>
        </div>
        <div class="discounts-list"></div>
    </div>
</template>
